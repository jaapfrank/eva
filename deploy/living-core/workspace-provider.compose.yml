# Persistent provider storage is independent of every core slot. No published ports.
services:
  gateway:
    pull_policy: never
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    pids_limit: 256
    mem_limit: 768m
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
    networks:
      connector:
        aliases:
        - eva2-mcp-gateway
    labels:
      io.eva2.component: workspace-provider
    image: ghcr.io/ibm/mcp-context-forge@sha256:daf923c247fd569df5f8c9ee418cbc259fade564f78e0a0852937139a181c4dd
    container_name: eva2-mcp-gateway
    entrypoint:
    - /bin/sh
    command:
    - /run/eva2/start-contextforge.sh
    environment:
      EVA_CONTEXTFORGE_JWT_SECRET_FILE: /run/secrets/contextforge-jwt
      EVA_CONTEXTFORGE_ENCRYPTION_SECRET_FILE: /run/secrets/contextforge-encryption
      EVA_CONTEXTFORGE_ADMIN_PASSWORD_FILE: /run/secrets/contextforge-admin-password
      HOST: 0.0.0.0
      DATABASE_URL: sqlite:////data/contextforge.db
      MCPGATEWAY_SKIP_MIGRATIONS: 'false'
      ENVIRONMENT: production
      AUTH_REQUIRED: 'true'
      REQUIRE_STRONG_SECRETS: 'true'
      ENABLE_METRICS: 'false'
      LOG_TO_FILE: 'false'
      GUNICORN_WORKERS: '1'
      GUNICORN_PRELOAD_APP: 'true'
      MCPGATEWAY_UI_AIRGAPPED: 'true'
      MCPGATEWAY_STDIO_TRANSPORT_ENABLED: 'false'
      PLUGINS_CAN_OVERRIDE_RBAC: 'false'
      SSRF_ALLOW_LOCALHOST: 'false'
      SSRF_ALLOW_PRIVATE_NETWORKS: 'true'
      SSRF_DNS_FAIL_CLOSED: 'true'
      UAID_ALLOWED_DOMAINS: '[]'
      CACHE_TYPE: none
    volumes:
    - type: volume
      source: secrets
      target: /run/secrets
      read_only: true
    - type: volume
      source: gateway-db
      target: /data
    - type: bind
      source: ${EVA_WORKSPACE_GATEWAY_STARTER:?set the reviewed startup script}
      target: /run/eva2/start-contextforge.sh
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:4444/health',
        timeout=3)); raise SystemExit(0 if data.get('status') == 'healthy' else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
  filesystem:
    pull_policy: never
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    init: true
    pids_limit: 256
    mem_limit: 768m
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
    networks:
      connector:
        aliases:
        - eva2-workspace-filesystem
    labels:
      io.eva2.component: workspace-provider
    image: ${EVA_WORKSPACE_FILESYSTEM_IMAGE:?set the immutable filesystem image reference}
    container_name: eva2-workspace-filesystem
    environment:
      EVA_CONTEXTFORGE_JWT_SECRET_FILE: /run/secrets/filesystem-jwt
      EVA_CONTEXTFORGE_ENCRYPTION_SECRET_FILE: /run/secrets/filesystem-encryption
      EVA_CONTEXTFORGE_ADMIN_PASSWORD_FILE: /run/secrets/filesystem-admin-password
    volumes:
    - type: volume
      source: filesystem-secrets
      target: /run/secrets
      read_only: true
    - type: volume
      source: files
      target: /proof-state
    healthcheck:
      disable: true
networks:
  connector:
    name: eva2-workspace-connectors
    external: true
volumes:
  files:
    name: eva2-workspace-files
    external: true
  gateway-db:
    name: eva2-workspace-gateway-db
    external: true
  secrets:
    name: eva2-workspace-secrets
    external: true
  filesystem-secrets:
    name: eva2-workspace-filesystem-secrets
    external: true
