services:
  postgres:
    image: docker.io/library/postgres@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
    pull_policy: missing
    container_name: ${EVA_STACK_POSTGRES_CONTAINER:-eva2-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVA_STACK_POSTGRES_DATABASE:-eva2}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: postgres
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U postgres -d "$${POSTGRES_DB}" &&
          psql -U postgres -d "$${POSTGRES_DB}" -Atc 'SELECT 1' | grep -qx 1
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  hindsight:
    image: ghcr.io/vectorize-io/hindsight@sha256:aeb0831e2ec55e659d5e69baa064c1278113e523513b8f60a1f09c5cabe59b9b
    pull_policy: missing
    container_name: ${EVA_STACK_HINDSIGHT_CONTAINER:-eva2-hindsight-memory}
    restart: unless-stopped
    init: true
    environment:
      HINDSIGHT_ENABLE_CP: "false"
      HINDSIGHT_API_LLM_PROVIDER: openai-codex
      HINDSIGHT_API_LLM_MODEL: gpt-6-astra
      HINDSIGHT_API_LLM_REASONING_EFFORT: medium
      # The bundled local BGE-small model is English-only and missed Dutch
      # corrections on the low-latency recall path. Reuse the same read-only,
      # rotating Codex consumer lease for multilingual cloud embeddings.
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai-codex
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW: "32"
      HINDSIGHT_API_WORKER_ID: ${EVA_STACK_HINDSIGHT_WORKER_ID:-eva2-hindsight-memory}
    volumes:
      # Hindsight can read a rotating access token, but never receives the
      # refresh token or write access to the credential authority.
      - ${EVA_HINDSIGHT_ACCESS_DIR:?set EVA_HINDSIGHT_ACCESS_DIR to a runtime-owned Hindsight access directory}:/home/hindsight/.codex:ro
      # Publish/validate this stable inode before Hindsight is created.
      - type: bind
        source: ${EVA_HINDSIGHT_ACCESS_DIR:?set EVA_HINDSIGHT_ACCESS_DIR to a runtime-owned Hindsight access directory}/auth.lock
        target: /home/hindsight/.codex/auth.lock
        read_only: false
        bind:
          create_host_path: false
      - hindsight-data:/home/hindsight/.pg0
    depends_on:
      hindsight-access-lease:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          assert json.load(urllib.request.urlopen('http://127.0.0.1:8888/health',timeout=2))['status']=='healthy'
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  model-access-lease:
    image: ${EVA_LIVING_CORE_IMAGE:?set EVA_LIVING_CORE_IMAGE to a content-addressed Living Core image}
    pull_policy: never
    container_name: ${EVA_STACK_MODEL_LEASE_CONTAINER:-eva2-model-access-lease}
    user: "1000:65532"
    restart: unless-stopped
    healthcheck:
      disable: true
    command:
      - python
      - -m
      - eva.operations.model_credentials
      - --source
      - /run/eva/codex-owner/auth.json
      - --target
      - /run/eva/model-lease/auth.json
    volumes:
      - ${EVA_CODEX_AUTH_DIR:?set EVA_CODEX_AUTH_DIR to the sole Codex auth authority directory}:/run/eva/codex-owner:ro
      - ${EVA_MODEL_ACCESS_LEASE_DIR:?set EVA_MODEL_ACCESS_LEASE_DIR to a runtime-owned lease directory}:/run/eva/model-lease:rw
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=4m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  hindsight-access-lease:
    image: ${EVA_LIVING_CORE_IMAGE:?set EVA_LIVING_CORE_IMAGE to a content-addressed Living Core image}
    pull_policy: never
    container_name: ${EVA_STACK_HINDSIGHT_LEASE_CONTAINER:-eva2-hindsight-access-lease}
    user: "1000:1000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/python
        - -c
        - >-
          from pathlib import Path;
          from eva.operations.model_credentials import check_codex_consumer_auth;
          check_codex_consumer_auth(Path('/run/eva/hindsight-access/auth.json'))
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    command:
      - python
      - -m
      - eva.operations.model_credentials
      - --format
      - codex-consumer
      - --source
      - /run/eva/codex-owner/auth.json
      - --target
      - /run/eva/hindsight-access/auth.json
    volumes:
      - ${EVA_CODEX_AUTH_DIR:?set EVA_CODEX_AUTH_DIR to the sole Codex auth authority directory}:/run/eva/codex-owner:ro
      - ${EVA_HINDSIGHT_ACCESS_DIR:?set EVA_HINDSIGHT_ACCESS_DIR to a runtime-owned Hindsight access directory}:/run/eva/hindsight-access:rw
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=4m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${EVA_LIVING_CORE_IMAGE:?set EVA_LIVING_CORE_IMAGE to a content-addressed Living Core image}
    pull_policy: never
    restart: "no"
    command:
      - python
      - -m
      - eva.operations.install_schema
    environment:
      EVA_DATABASE_DSN_FILE: /run/secrets/database_dsn
    secrets:
      - database_dsn
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  core:
    image: ${EVA_LIVING_CORE_IMAGE:?set EVA_LIVING_CORE_IMAGE to a content-addressed Living Core image}
    pull_policy: never
    container_name: ${EVA_STACK_CORE_CONTAINER:-eva2-living-core}
    restart: unless-stopped
    environment:
      EVA_COLD_PATH_IDLE_SECONDS: ${EVA_COLD_PATH_IDLE_SECONDS:-300}
      EVA_CONVERSATION_AUTH_FILE: /run/eva/model-lease/auth.json
      EVA_CONVERSATION_MODEL: ${EVA_CONVERSATION_MODEL:-gpt-6-astra}
      EVA_CONVERSATION_REASONING_EFFORT: ${EVA_CONVERSATION_REASONING_EFFORT:-medium}
      EVA_DATABASE_DSN_FILE: /run/secrets/database_dsn
      EVA_HINDSIGHT_BANK_NAMESPACE: ${EVA_HINDSIGHT_BANK_NAMESPACE:-eva2}
      EVA_HINDSIGHT_URL: http://hindsight:8888
      EVA_FILE_BATCH_ROOT: /var/lib/eva/work
      EVA_IDENTITY_DESCRIPTION: ${EVA_IDENTITY_DESCRIPTION:-Je bent een warme, nuchtere en capabele digitale huisgenoot.}
      EVA_IDENTITY_NAME: ${EVA_IDENTITY_NAME:-Eva}
      EVA_PERSONAL_INTEREST_LEASE_SECONDS: ${EVA_PERSONAL_INTEREST_LEASE_SECONDS:-90}
      EVA_RUNTIME_INSTALLATION_ID: ${EVA_RUNTIME_INSTALLATION_ID:?set the installation identity}
      EVA_RUNTIME_TENANT_ID: ${EVA_RUNTIME_TENANT_ID:?set the tenant identity}
    secrets:
      - database_dsn
    volumes:
      - ${EVA_MODEL_ACCESS_LEASE_DIR:?set EVA_MODEL_ACCESS_LEASE_DIR to a runtime-owned lease directory}:/run/eva/model-lease:ro
      - work-data:/var/lib/eva/work:rw
    depends_on:
      hindsight:
        condition: service_healthy
      model-access-lease:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - ${EVA_STACK_BIND_ADDRESS:-127.0.0.1}:${EVA_STACK_CORE_PORT:-44674}:8080
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  database_dsn:
    file: ${EVA_DATABASE_DSN_FILE_HOST:?set EVA_DATABASE_DSN_FILE_HOST to a DSN file readable only by runtime UID 65532}
  postgres_password:
    file: ${EVA_POSTGRES_PASSWORD_FILE_HOST:?set EVA_POSTGRES_PASSWORD_FILE_HOST to a mode-0600 password file}

volumes:
  hindsight-data:
    name: ${EVA_STACK_HINDSIGHT_VOLUME:-eva2-hindsight-memory}
    labels:
      eva2.component: semantic-memory
  postgres-data:
    name: ${EVA_STACK_POSTGRES_VOLUME:-eva2-postgres}
    labels:
      eva2.component: operational-truth
  work-data:
    name: ${EVA_STACK_WORK_VOLUME:-eva2-living-work}
    labels:
      eva2.component: bounded-workspace
