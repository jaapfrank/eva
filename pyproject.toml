[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "eva2-living-core"
version = "0.0.0"
description = "Eva 2 Living Core validation build"
requires-python = "==3.12.16"
license = "LicenseRef-Proprietary"
dependencies = [
  "alembic==1.20.1",
  "cryptography==50.0.2",
  "fastapi==0.162.0",
  "openai==3.46.0",
  "psycopg[binary]==3.3.8",
  "PyNaCl==1.6.2",
  "PyYAML==6.0.3",
  "pydantic==2.14.3",
  "pydantic-ai-slim==2.66.0",
  "SQLAlchemy==2.1.8",
  "tiktoken==0.14.0",
  "uvicorn==0.54.0",
  "websockets==17.4",
]

[project.optional-dependencies]
optional-models = ["anthropic==2.6.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["eva*", "tools*", "connector_sdk*"]

[tool.setuptools.package-data]
"eva.application" = ["default_identity_pack.json", "default_identity_pack_trust.json"]
"eva.resources.portable_v1" = ["schema-freeze-v1.json", "provenance.json", "schemas/**/*.json"]
"eva.voice_service" = ["client.html"]
"eva.adapters.model" = ["tokenizer_data/*"]
"eva.adapters.api" = [
  "dashboard_static/*.html",
  "dashboard_static/*.json",
  "dashboard_static/assets/*.css",
  "dashboard_static/assets/*.js",
]

[tool.eva2]
target-python = "3.12.16"
dependency-lock = "deploy/requirements.lock"
tranche-4d-dependency-lock = "deploy/requirements-4d.lock"
tranche-4d-dependency-extra = "tranche-4d"
tranche-4d-dependency-source-binding = "deploy/release/4d-dependency-source-binding.json"
platform-lock = "deploy/release/platform-lock.json"
design-status = "selected_not_implemented"
