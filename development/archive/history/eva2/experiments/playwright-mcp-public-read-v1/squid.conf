# Exactly one public, credential-free browser-read destination.
#
# This proxy is the only container in the test cell with normal Docker egress.
# The browser is attached solely to the separate gatewayless internal network.
# TLS is tunnelled but never intercepted; the destination hostname and port are
# checked before Squid establishes the tunnel.

http_port 3128

acl allowed_destination dstdomain .example.com
acl allowed_tls_port port 443
acl browser_read_method method GET HEAD CONNECT

# Squid must resolve the public hostname itself.  No private or local target
# is admitted, even if a future profile accidentally changes a browser URL.
acl private_destination dst 0.0.0.0/8
acl private_destination dst 10.0.0.0/8
acl private_destination dst 100.64.0.0/10
acl private_destination dst 127.0.0.0/8
acl private_destination dst 169.254.0.0/16
acl private_destination dst 172.16.0.0/12
acl private_destination dst 192.0.0.0/24
acl private_destination dst 192.0.2.0/24
acl private_destination dst 192.168.0.0/16
acl private_destination dst 198.18.0.0/15
acl private_destination dst 198.51.100.0/24
acl private_destination dst 203.0.113.0/24
acl private_destination dst 224.0.0.0/4
acl private_destination dst 240.0.0.0/4

http_access deny private_destination
http_access allow browser_read_method allowed_destination allowed_tls_port
http_access deny all

# This is a stateless proof route, not a cache or general browsing service.
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
maximum_object_size_in_memory 0 KB
access_log stdio:/dev/stdout
cache_log /dev/stderr
coredump_dir /tmp
pid_filename /tmp/squid.pid
pinger_enable off
visible_hostname eva-public-read-proxy
