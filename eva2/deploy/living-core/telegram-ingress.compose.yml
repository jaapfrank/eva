services:
  telegram-ingress:
    profiles: ["telegram-native"]
    image: ${EVA_LIVING_CORE_IMAGE:?set the immutable Living Core image reference}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m
    command: ["python", "-m", "eva.operations.telegram_ingress"]
    environment:
      EVA_DATABASE_DSN_FILE: /run/secrets/database_dsn
      EVA_LIVING_CORE_URL: http://core:8080
      EVA_RUNTIME_INSTALLATION_ID: ${EVA_RUNTIME_INSTALLATION_ID:?set the installation identity}
      EVA_RUNTIME_TENANT_ID: ${EVA_RUNTIME_TENANT_ID:?set the tenant identity}
      EVA_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      EVA_TELEGRAM_PRINCIPAL_BINDINGS_FILE: /run/secrets/telegram_principal_bindings
      EVA_TELEGRAM_PAIRING_SECRET_FILE: /run/secrets/telegram_pairing_secret
    volumes:
      - type: bind
        source: ${EVA_DATABASE_DSN_FILE_HOST:?set a runtime-owned database DSN file}
        target: /run/secrets/database_dsn
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EVA_TELEGRAM_BOT_TOKEN_FILE_HOST:?set a runtime-owned Eva 2 Telegram token file}
        target: /run/secrets/telegram_bot_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EVA_TELEGRAM_PRINCIPAL_BINDINGS_FILE_HOST:?set a runtime-owned Telegram binding file}
        target: /run/secrets/telegram_principal_bindings
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EVA_TELEGRAM_PAIRING_SECRET_FILE_HOST:?set a runtime-owned Telegram pairing secret file}
        target: /run/secrets/telegram_pairing_secret
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      core:
        condition: service_healthy
