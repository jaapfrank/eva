<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eva Chrome-bedieningsproef</title>
<style>body{font:19px/1.5 system-ui;max-width:760px;margin:40px auto;padding:20px;background:#f5f7fb;color:#182838}button,a{font:inherit;padding:12px;margin:8px 8px 8px 0}button:disabled{opacity:.5}#control{padding:16px;background:#e1eaf4;border-radius:8px}aside{padding:18px;background:white;border:1px solid #bbb}</style>
<h1>Chrome-bedieningsproef</h1><p>Deze pagina verandert alleen haar eigen testweergave en teller.</p>
<button id="toggle" aria-expanded="false" aria-controls="detail">Toon proeftekst</button><aside id="detail" hidden>De proeftekst is zichtbaar. Eva kan dit paneel weer sluiten.</aside>
<h2>Lopende klik stoppen</h2><p>De proefknop is eerst geblokkeerd. Eva kan erop wachten terwijl jij overneemt.</p>
<button id="pending" disabled>Tel één proefklik</button><p id="count" role="status">Proefklikken: 0</p>
<div id="control"><p id="state">Verbinding controleren…</p><button id="takeover">Neem over</button><button id="release" disabled>Geef proefknop vrij</button><button id="resume">Geef terug aan Eva</button><button id="disconnect">Verbinding intrekken</button><p id="error" role="alert"></p></div>
<script>
let state, count=0;
const $=id=>document.getElementById(id);
$('toggle').onclick=()=>{const open=$('detail').hidden;$('detail').hidden=!open;$('toggle').setAttribute('aria-expanded',String(open));$('toggle').textContent=open?'Verberg proeftekst':'Toon proeftekst';};
$('pending').onclick=()=>{$('count').textContent=`Proefklikken: ${++count}`;};
$('release').onclick=()=>{if(state?.state==='owner'){$('pending').disabled=false;$('release').disabled=true;}};
function show(s){state=s;$('state').textContent=({eva:'Eva mag bedienen',owner:'Jij hebt de bediening — Eva is geblokkeerd',disconnected:'Verbinding ingetrokken',taking_over:'Lopende actie stoppen…',connecting:'Kies opnieuw hetzelfde tabblad via Allow & select',recovery_required:'Stop nog niet bevestigd'})[s.state]+(s.busy?' · ACTIE BEZIG':'');$('takeover').disabled=!['eva','connecting'].includes(s.state);$('resume').disabled=s.state!=='owner';$('release').disabled=s.state!=='owner'||!$('pending').disabled;$('disconnect').disabled=s.state==='disconnected';}
for(const action of ['takeover','resume','disconnect'])$(action).onclick=async()=>{try{const r=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,epoch:state.epoch})});if(!r.ok)throw Error();show(await r.json());}catch{$('error').textContent='Bediening niet bevestigd; controleer de verbinding.';}};
async function read(){try{const r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error();show(await r.json());}catch{$('state').textContent='Verbindingsstatus niet beschikbaar';for(const id of ['takeover','resume','disconnect','release'])$(id).disabled=true;}}
read();setInterval(read,250);
</script></html>
