# Candidate overlay for the saved Voice PE configuration; not a flash target.
# Use this as the main configuration with the original device as a package.
# The mapping-form handler replaces the original list-form handler in 2026.6.2.
# Requires its va, mww, external_media_player, master_mute_switch,
# timer_ringing, wake_sound, play_sound and control_leds IDs.
# A wake-word interruption is not yet arbitrary-speech full duplex.

event:
  - platform: template
    id: eva_voice_interruption
    name: Eva voice interruption
    event_types:
      - stop_requested
      - resume_requested

script:
  - id: eva_resume_listening
    mode: restart
    parameters:
      detected_word: string
      play_chime: bool
    then:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 2s
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - switch.is_off: master_mute_switch
              - switch.is_off: timer_ringing
              - api.connected:
          then:
            - if:
                condition:
                  and:
                    - lambda: return play_chime;
                    - switch.is_on: wake_sound
                then:
                  - script.execute:
                      id: play_sound
                      priority: true
                      sound_file: wake_word_triggered_sound
                  - delay: 300ms
            # Recheck after the cancellable chime delay: mute/disconnection
            # may have changed while this script yielded.
            - if:
                condition:
                  and:
                    - not:
                        voice_assistant.is_running:
                    - switch.is_off: master_mute_switch
                    - switch.is_off: timer_ringing
                    - api.connected:
                then:
                  - voice_assistant.start:
                      wake_word: !lambda return detected_word;

micro_wake_word:
  on_wake_word_detected:
    then:
      - if:
          condition:
            switch.is_off: master_mute_switch
          then:
            # A second detection also cancels a pending re-listen after stop.
            - script.stop: eva_resume_listening
            - if:
                condition:
                  switch.is_on: timer_ringing
                then:
                  - switch.turn_off: timer_ringing
                else:
                  - if:
                      condition:
                        or:
                          - voice_assistant.is_running:
                          - media_player.is_announcing:
                              id: external_media_player
                      then:
                        # Silence is requested locally before any network report.
                        - media_player.stop:
                            announcement: true
                            id: external_media_player
                        - voice_assistant.stop:
                        # Report through a normal native API entity; this grants
                        # the device no Home Assistant service-call permission.
                        - event.trigger:
                            id: eva_voice_interruption
                            event_type: !lambda |-
                              return (wake_word == "Stop" || wake_word == "stop")
                                ? "stop_requested" : "resume_requested";
                        - if:
                            condition:
                              lambda: return wake_word != "Stop" && wake_word != "stop";
                            then:
                              - script.execute:
                                  id: eva_resume_listening
                                  detected_word: !lambda return wake_word;
                                  play_chime: false
                      else:
                        - if:
                            condition:
                              lambda: return wake_word != "Stop" && wake_word != "stop";
                            then:
                            - script.execute:
                                id: eva_resume_listening
                                detected_word: !lambda return wake_word;
                                play_chime: true
