[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eva2-living-core"
version = "0.0.0"
description = "Eva 2 Living Core validation build"
requires-python = "==3.12.14"
license = "LicenseRef-Proprietary"
dependencies = [
  "alembic==1.19.1",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "PyNaCl==1.6.2",
  "pydantic==2.12.5",
  "pydantic-ai-slim==2.32.1",
  "SQLAlchemy==2.0.52",
  "uvicorn==0.41.0",
  "websockets==17.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["eva*"]

[tool.eva2]
target-python = "3.12.14"
dependency-lock = "requirements.lock"
tranche-4d-dependency-lock = "requirements-4d.lock"
tranche-4d-dependency-extra = "tranche-4d"
tranche-4d-dependency-source-binding = "release/4d-dependency-source-binding.json"
platform-lock = "release/platform-lock.json"
design-status = "selected_not_implemented"
